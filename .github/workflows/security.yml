name: Security & Vulnerability Scanning

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 4 * * 1' # Run weekly on Mondays

permissions:
  contents: read

jobs:
  security-audit:
    name: Dependency & SAST Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Security Scanners
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit bandit

      - name: Run Bandit Static Application Security Testing (SAST)
        run: |
          bandit -r backend/app -ll -ii -x backend/app/tests || true

      - name: Run Pip-Audit Dependency Vulnerability Scan
        run: |
          pip-audit -r backend/requirements.txt || true
